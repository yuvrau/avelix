<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AvelixCloud - Your Ultimate Hosting Solution</title>
    <meta name="description" content="High-performance Minecraft, VPS, and Discord bot hosting with 99.9% uptime, DDoS protection, and instant setup. Your ultimate hosting solution." />
    <meta name="author" content="Avelix Cloud" />
    <meta name="keywords" content="minecraft hosting, game server hosting, vps hosting, discord bot hosting, ddos protection, game servers, avelix cloud" />

    <link rel="icon" href="/favicon-new.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon-new.png" />

    <meta property="og:title" content="AvelixCloud - Your Ultimate Hosting Solution" />
    <meta property="og:description" content="High-performance game server hosting with 99.9% uptime and DDoS protection. Deploy your server in seconds." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://avelix.cloud" />
    <meta property="og:image" content="https://avelix.cloud/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AvelixCloud" />
    <meta name="twitter:title" content="AvelixCloud - Your Ultimate Hosting Solution" />
    <meta name="twitter:description" content="High-performance game server hosting with 99.9% uptime and DDoS protection." />
    <meta name="twitter:image" content="https://avelix.cloud/og-image.png" />
    
    <link rel="canonical" href="https://avelix.cloud" />

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #08061a;
      }

      #initial-loader.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .loader-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
      }

      .loader-logo-container {
        position: relative;
        width: 90px;
        height: 90px;
      }

      .loader-logo-container img {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
      }

      .loader-orbit {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #8b5cf6;
        animation: orbit-spin 1.2s linear infinite;
      }

      .loader-orbit-2 {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        border: 1px solid transparent;
        border-bottom-color: #c084fc;
        animation: orbit-spin 1.8s linear infinite reverse;
      }

      .loader-brand {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: #e2e8f0;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .loader-brand span {
        background: linear-gradient(135deg, #8b5cf6, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .loader-dots {
        display: flex;
        gap: 8px;
      }

      .loader-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #8b5cf6;
        animation: dot-bounce 1.4s ease-in-out infinite;
      }

      .loader-dot:nth-child(2) { animation-delay: 0.15s; }
      .loader-dot:nth-child(3) { animation-delay: 0.3s; }

      @keyframes orbit-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes dot-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1.2); opacity: 1; }
      }
    </style>
  </head>

  <body>
    <div id="initial-loader">
      <div class="loader-wrap">
        <div class="loader-logo-container">
          <div class="loader-orbit"></div>
          <div class="loader-orbit-2"></div>
          <img src="/favicon-new.png" alt="Avelix Cloud" />
        </div>
        <div class="loader-brand">Avelix<span>Cloud</span></div>
        <div class="loader-dots">
          <div class="loader-dot"></div>
          <div class="loader-dot"></div>
          <div class="loader-dot"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() {
              loader.remove();
            }, 600);
          }
        }, 1200);
      });
    </script>
  </body>
</html>
